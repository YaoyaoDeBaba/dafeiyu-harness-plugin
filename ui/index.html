<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selfloop · 作业台</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<header class="topbar">
  <div class="projname" id="projname">…</div>
  <nav class="stepper" id="stepper"></nav>
  <div class="topright">
    <span class="clock" id="clock">—</span>
    <span id="roundcount"></span>
    <button type="button" class="btn-stop" id="stop-btn">停下来</button>
  </div>
</header>

<main class="workbench">
  <div class="missing-banner" id="missing-banner" hidden></div>

  <section class="stage-section" id="sec-input">
    <h2 class="stage-head">① 投入</h2>
    <div class="input-grid" id="input-root"></div>
  </section>

  <section class="stage-section" id="sec-understand">
    <h2 class="stage-head">② 理解</h2>
    <div id="understand-root"></div>
  </section>

  <section class="stage-section" id="sec-rounds">
    <h2 class="stage-head">③ 过程</h2>
    <div id="rounds-root"></div>
  </section>

  <section class="stage-section" id="sec-deliver">
    <h2 class="stage-head">④ 交付</h2>
    <div id="deliver-root"></div>
  </section>

  <details class="tech" id="tech-details">
    <summary>技术细节（给 agent / 工程师看）</summary>
    <div class="tech-root">
      <div id="tech-kpi"></div>
      <div class="tech-block">
        <div class="tech-label">距离曲线（点选切帧）</div>
        <div class="curve-wrap" id="curve"></div>
        <div class="frame-preview" id="frame-preview"></div>
      </div>
      <div class="tech-block">
        <div class="tech-label">胶片带</div>
        <div class="filmstrip" id="filmstrip"></div>
      </div>
      <div class="tech-block">
        <div class="tech-label">节点台帐</div>
        <div id="ledger"></div>
      </div>
      <div class="tech-block">
        <div class="tech-label">报告 report.md</div>
        <div class="report-head"><button type="button" class="copy-btn" id="copy-btn">复制全文</button></div>
        <pre class="report-pre" id="report-pre"></pre>
      </div>
      <div class="tech-block">
        <div class="tech-label">实时事件 live.jsonl</div>
        <div id="live-box"></div>
      </div>
    </div>
  </details>
</main>

<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast"></div>

<script type="module" src="/ui/app.js"></script>
</body>
</html>
